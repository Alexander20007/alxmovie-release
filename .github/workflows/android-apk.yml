name: Build Android APK

on:
  push:
    branches: [main, master]
    paths-ignore: ["**/*.md"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
      KS_ALIAS: ${{ secrets.KEY_ALIAS }}
      KS_PASS: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      # Procura o projeto nativo: um zip "alxmovies-native*.zip" na raiz do repositório, ou o projeto solto.
      - name: Localizar o projeto
        run: |
          ZIP=$(find . -maxdepth 1 -name "alxmovies-native*.zip" | head -1)
          if [ -n "$ZIP" ]; then
            echo "Descompactando $ZIP"
            rm -rf _app && mkdir _app && unzip -q "$ZIP" -d _app
            DIR=$(find _app -name settings.gradle.kts -not -path "*/node_modules/*" | head -1 | xargs -r dirname)
          elif [ -f settings.gradle.kts ]; then
            DIR=.
          else
            DIR=$(find . -maxdepth 3 -name settings.gradle.kts | head -1 | xargs -r dirname)
          fi
          if [ -z "$DIR" ]; then echo "settings.gradle.kts não encontrado"; exit 1; fi
          echo "APP_DIR=$DIR" >> "$GITHUB_ENV"
          echo "Projeto em: $DIR"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar o SDK do Android
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-35" "build-tools;35.0.0" > /dev/null

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compilar o APK (Gradle)
        working-directory: ${{ env.APP_DIR }}
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 2.0.${{ github.run_number }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Alinhar e assinar o APK
        working-directory: ${{ env.APP_DIR }}
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          UNSIGNED=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          echo "APK sem assinatura: $UNSIGNED"

          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > release.keystore
            KS=release.keystore; ALIAS="$KS_ALIAS"; PASS="$KS_PASS"
            echo "Assinando com a SUA chave (secrets)."
          else
            KS=keystore/alxmovies-sideload.p12; ALIAS=alxmovies; PASS=alxmovies123
            echo "Assinando com a chave de teste do repositório."
          fi

          "$BT/zipalign" -p -f 4 "$UNSIGNED" aligned.apk
          "$BT/apksigner" sign --ks "$KS" --ks-key-alias "$ALIAS" --ks-pass "pass:$PASS" --key-pass "pass:$PASS" \
            --out ALXmovies.apk aligned.apk
          "$BT/apksigner" verify --verbose ALXmovies.apk | head -5
          ls -la ALXmovies.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ALXmovies-apk
          path: ${{ env.APP_DIR }}/ALXmovies.apk

      - name: Publicar em Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.${{ github.run_number }}
          name: ALXmovies nativo 2.0.${{ github.run_number }}
          body: "APK Android nativo (Kotlin + Jetpack Compose) do ALXmovies. Baixe o arquivo ALXmovies.apk abaixo e instale no celular."
          files: ${{ env.APP_DIR }}/ALXmovies.apk
